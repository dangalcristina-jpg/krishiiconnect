<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%234CAF50'/%3E%3Ctext x='16' y='22' font-size='18' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3EK%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Contact — Krishi Connect</title>
    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body>
    <div id="navbar"></div>
    <main>
      <div class="container page-header">
        <h1 data-i18n="contact.title"></h1>
        <p data-i18n="contact.subtitle"></p>
      </div>
      <div class="container" style="padding-bottom:48px;">
        <div style="display:grid;gap:24px;grid-template-columns:1fr;">
          <div class="card card-pad">
            <form id="contact-form" class="form">
              <div class="field">
                <label for="c-name" data-i18n="contact.name"></label>
                <input id="c-name" name="name" required />
              </div>
              <div class="field">
                <label for="c-email" data-i18n="contact.email"></label>
                <input id="c-email" name="email" type="email" required />
              </div>
              <div class="field">
                <label for="c-msg" data-i18n="contact.message"></label>
                <textarea id="c-msg" name="message" rows="5" required></textarea>
              </div>
              <p id="contact-status" class="form-success" style="display:none;"></p>
              <button type="submit" class="btn btn-primary" id="contact-submit" data-i18n="contact.submit"></button>
            </form>
          </div>
        </div>
      </div>
    </main>
    <div id="footer"></div>
    <script type="module" src="/src/pages/contact.js"></script>
  </body>
</html>
