<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%234CAF50'/%3E%3Ctext x='16' y='22' font-size='18' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3EK%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Register — Krishi Connect</title>
    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body>
    <div id="navbar"></div>
    <main>
      <div class="container" style="padding:48px 0;">
        <div style="max-width:480px;margin:0 auto;">
          <div class="card card-pad">
            <div class="brand mb-4"><img src="/images/logo.png" class="brand-logo" alt="Krishi Connect" /><span class="brand-name">Krishi Connect</span></div>
            <h1 class="block-title" data-i18n="auth.registerTitle"></h1>
            <p class="text-muted" data-i18n="auth.registerSubtitle"></p>
            <div class="mt-6" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
              <button type="button" id="role-farmer" class="btn" style="background:var(--green);color:#fff;" data-i18n="auth.farmer"></button>
              <button type="button" id="role-wholesaler" class="btn btn-outline" data-i18n="auth.wholesaler"></button>
            </div>
            <form id="register-form" class="form mt-6">
              <div class="field">
                <label for="full_name" data-i18n="auth.fullName"></label>
                <input id="full_name" name="full_name" required />
              </div>
              <div class="field" id="business-field" style="display:none;">
                <label for="business_name" data-i18n="auth.businessName"></label>
                <input id="business_name" name="business_name" />
              </div>
              <div class="field">
                <label for="phone" data-i18n="auth.phone"></label>
                <div class="otp-row">
                  <input id="phone" name="phone" type="tel" inputmode="numeric" required placeholder="98XXXXXXXX" />
                  <button type="button" id="send-otp-btn" class="btn btn-outline btn-sm">Send OTP</button>
                </div>
              </div>
              <div class="field" id="otp-field" style="display:none;">
                <label for="otp_code">OTP Code</label>
                <div class="otp-row">
                  <input id="otp_code" name="otp_code" type="text" inputmode="numeric" maxlength="4" placeholder="4-digit code" />
                  <button type="button" id="verify-otp-btn" class="btn btn-outline btn-sm">Verify</button>
                </div>
                <p class="field-hint" id="otp-hint"></p>
              </div>
              <div class="form-row two">
                <div class="field">
                  <label for="pin" data-i18n="auth.pin"></label>
                  <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required placeholder="••••" />
                </div>
                <div class="field">
                  <label for="confirm_pin">Confirm PIN</label>
                  <input id="confirm_pin" name="confirm_pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required placeholder="••••" />
                </div>
              </div>
              <p class="field-hint" data-i18n="auth.pinHint"></p>
              <p id="register-error" class="form-error" style="display:none;"></p>
              <p id="register-success" class="form-success" style="display:none;" data-i18n="auth.registerSuccess"></p>
              <button type="submit" class="btn btn-primary btn-block" id="register-submit" data-i18n="auth.register"></button>
            </form>
            <div class="flex items-center justify-between mt-4 text-sm">
              <span class="text-muted" data-i18n="auth.haveAccount"></span>
              <a href="/login" class="font-semibold" style="color:var(--green);" data-i18n="auth.loginHere"></a>
            </div>
          </div>
        </div>
      </div>
    </main>
    <div id="footer"></div>
    <script type="module" src="/src/pages/register.js"></script>
  </body>
</html>
